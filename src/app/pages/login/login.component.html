<div class="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Área Administrativa</h1>
        <p class="text-white/70">MRX Eventos</p>
      </div>

      @if (error) {
        <div class="mb-6 p-4 bg-red-500/20 border border-red-500 rounded-lg text-white text-center">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="login()" class="space-y-6">
        <div>
          <label for="email" class="block text-white font-medium mb-2">
            Email
          </label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="loading"
            class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50"
            placeholder="seu@email.com"
          />
        </div>

        <div>
          <label for="password" class="block text-white font-medium mb-2">
            Senha
          </label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            [disabled]="loading"
            class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-3 px-6 rounded-lg hover:from-purple-600 hover:to-indigo-600 transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
        >
          @if (loading) {
            <span>Entrando...</span>
          } @else {
            <span>Entrar</span>
          }
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/" class="text-white/70 hover:text-white transition-colors text-sm">
          ← Voltar ao Site
        </a>
      </div>
    </div>
  </div>
</div>
